name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore SpanSight.slnx
      - run: dotnet format SpanSight.slnx --verify-no-changes --no-restore
      - run: dotnet build SpanSight.slnx --no-restore --configuration Release
      - name: Test with line coverage
        run: >
          dotnet test SpanSight.slnx --no-build --configuration Release
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings
          --results-directory artifacts/coverage
      # NFR-5 (SRS §6): >=70% line coverage on ingestion/API core. The scoped number is the
      # gate; the repo-wide number prints for information only. Measurement scope (EF
      # migrations + generated code excluded) is coverlet.runsettings; gated scope is
      # GATE_SCOPE in the script. The API rows come from the Testcontainers suite, which runs
      # here because ubuntu-latest ships a working Docker daemon.
      - name: Coverage gate (NFR-5)
        run: python3 tools/coverage-gate.py --results-dir artifacts/coverage --threshold 70
      # FR-1.1: the committed era fixtures (300 real rows each) must convert end to end — .NET
      # normalization plus the DuckDB Parquet write — on every PR. One fixture per *published
      # layout*, not per era: 1992 (134 cols), 2010 (133), 2016 (135, adds CAT10), 2017 (137, adds
      # CAT23/CAT29) and 2025 (123). All five, so a schema change cannot pass CI by only being
      # right about the three layouts the original sample happened to cover. Fixture-only, so it
      # stays fast and no bulk NBI data is involved.
      - name: Install DuckDB
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          sudo unzip -q -o /tmp/duckdb.zip -d /usr/local/bin
          duckdb --version
      - name: Convert vintage fixtures (FR-1.1)
        run: tools/vintages/convert.sh --fixtures
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Web lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  bicep:
    name: Bicep lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Compile only — linter diagnostics surface here; nothing is deployed from CI.
      # deploy.yml (OIDC to Azure) is Week 5 scope.
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null

  e2e:
    name: E2E smoke + a11y
    runs-on: ubuntu-latest
    # Full stack against the fixture: real PostGIS + migrated schema + loaded rows,
    # the real API, and the dev server the Playwright config starts (FR-0.4 AC-6, NFR-7).
    services:
      postgres:
        image: imresamu/postgis:16-3.5
        env:
          POSTGRES_USER: spansight
          POSTGRES_PASSWORD: spansight
          POSTGRES_DB: spansight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spansight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Load fixture snapshot
        run: >
          dotnet run --project src/SpanSight.Ingestion --configuration Release --
          load --file src/tests/fixtures/nbi_sample_2025.csv --snapshot-year 2025
      - name: Start API
        run: |
          dotnet run --project src/SpanSight.Api --configuration Release --launch-profile http &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:5194/readyz >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "API did not become ready" >&2
          exit 1
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  # Dependency + container scanning (FR-0.6 AC-2, NFR-4). The .NET half already runs inside
  # the dotnet job: NuGet audit fails the build on known-vulnerable packages (NU1903 +
  # TreatWarningsAsErrors). This job covers the two halves that were missing — the shipped
  # container image, and the web dependency tree.
  scan:
    name: Dependency + container scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Cheap check first, so a dependency finding still reports when the image build breaks.
      # npm audit reads package-lock.json and queries the registry, so no npm ci is needed.
      # Fails on any high/critical advisory except the reviewed, time-boxed exceptions in
      # tools/npm-audit-allowlist.json — each of which stops working on its review_by date.
      - name: Audit web dependencies
        run: python3 tools/npm-audit-gate.py --web-dir web
      - uses: docker/setup-buildx-action@v3
      # The same image deploy.yml ships, built the same way from the repo root, but never
      # pushed — CI scans exactly what would go to GHCR without publishing it.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/SpanSight.Api/Dockerfile
          push: false
          load: true
          tags: spansight-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Fails on HIGH/CRITICAL that have a fix available. Unfixed CVEs are reported but do
      # not block: a base-image CVE with no patch published yet is not something a PR can
      # act on, and blocking on it would only train people to bypass the job. `cache: true`
      # persists the vulnerability DB between runs (it is ~150 MB and rate-limited at source).
      - name: Scan API image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: spansight-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          cache: true
