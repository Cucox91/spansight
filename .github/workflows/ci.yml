name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore SpanSight.slnx
      - run: dotnet format SpanSight.slnx --verify-no-changes --no-restore
      - run: dotnet build SpanSight.slnx --no-restore --configuration Release
      # DuckDB and the fixture Parquet come first because the FR-1.2 trend golden tests run inside
      # `dotnet test`: they execute tools/trends/trends.sql over the fixtures and compare it to
      # SpanSight.Core's classifier row by row. Without these they would skip, and a drift between
      # the SQL and the C# would reach main unnoticed.
      - name: Install DuckDB
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          sudo unzip -q -o /tmp/duckdb.zip -d /usr/local/bin
          duckdb --version
      # FR-1.1: the committed era fixtures (300 real rows each) must convert end to end — .NET
      # normalization plus the DuckDB Parquet write — on every PR. One fixture per *published
      # layout*, not per era: 1992 (134 cols), 2010 (133), 2016 (135, adds CAT10), 2017 (137, adds
      # CAT23/CAT29) and 2025 (123). All five, so a schema change cannot pass CI by only being
      # right about the three layouts the original sample happened to cover. Fixture-only, so it
      # stays fast and no bulk NBI data is involved.
      - name: Convert vintage fixtures (FR-1.1)
        run: tools/vintages/convert.sh --fixtures
      # FR-1.2: build the trend aggregates from those same fixtures and check the job's own
      # invariants (rollups reconcile with the per-bridge series, no double-counted structure).
      # The golden comparison against the C# classifier happens in the test step below.
      - name: Build trend aggregates from fixtures (FR-1.2)
        run: tools/trends/build-trends.sh --fixtures
      # FR-1.3: the same shape again — run the published transition job over both of its sources and
      # let it check its own invariants (cohort matrices sum to the national matrix, no pair falls
      # into an unmapped cohort, every row's span describes its pairs). The synthetic source is the
      # hand-computed one, so a failure here means the arithmetic moved.
      - name: Build transition matrices from fixtures (FR-1.3)
        run: |
          tools/deterioration/build-deterioration.sh --fixtures
          tools/deterioration/build-deterioration.sh --synthetic
      # FR-1.5: the Census staging fixture and the bridge→county join over it. This moved ahead of
      # `dotnet test` when the join arrived: CountyJoinGoldenTests executes
      # tools/census/county-join.sql itself against data/census/fixtures-out/parquet, so with the
      # conversion still running after the tests those 36 assertions would skip on their
      # prerequisite and a drift in the join would reach main with CI green.
      #
      # verify-fixtures.sh asserts the two properties a row count cannot see (the boundaries answer
      # point-in-polygon; the FIPS keys are still zero-padded text). join-counties.sh --fixtures
      # then runs the join's own eight invariants over 16 hand-placed points. Fixture-only; no
      # download, and no database — the bridge side in fixture mode is a committed CSV.
      - name: Convert + verify census fixtures, then join (FR-1.5)
        run: |
          tools/census/convert.sh --fixtures
          tools/census/verify-fixtures.sh
          tools/census/join-counties.sh --fixtures
      - name: Test with line coverage
        run: >
          dotnet test SpanSight.slnx --no-build --configuration Release
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings
          --results-directory artifacts/coverage
      # NFR-5 (SRS §6): >=70% line coverage on ingestion/API core. The scoped number is the
      # gate; the repo-wide number prints for information only. Measurement scope (EF
      # migrations + generated code excluded) is coverlet.runsettings; gated scope is
      # GATE_SCOPE in the script. The API rows come from the Testcontainers suite, which runs
      # here because ubuntu-latest ships a working Docker daemon.
      - name: Coverage gate (NFR-5)
        run: python3 tools/coverage-gate.py --results-dir artifacts/coverage --threshold 70
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Web lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  bicep:
    name: Bicep lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Compile only — linter diagnostics surface here; nothing is deployed from CI.
      # deploy.yml (OIDC to Azure) is Week 5 scope.
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null

  e2e:
    name: E2E smoke + a11y (${{ matrix.mode }})
    runs-on: ubuntu-latest
    # Full stack against the fixture: real PostGIS + migrated schema + loaded rows,
    # the real API, and the dev server the Playwright config starts (FR-0.4 AC-6, NFR-7).
    #
    # Two legs, because the SPA has two data paths and until now CI only ran one of them.
    # `fallback` is the API GeoJSON path; `tiles` is the PMTiles path production actually uses.
    # Three bugs (PRs #15, #16, #18) reached the live demo through that gap, each of them
    # structurally invisible to a fallback-only suite — see e2e/tiles.spec.ts and issue #34.
    strategy:
      fail-fast: false
      matrix:
        mode: [fallback, tiles]
    services:
      postgres:
        image: imresamu/postgis:16-3.5
        env:
          POSTGRES_USER: spansight
          POSTGRES_PASSWORD: spansight
          POSTGRES_DB: spansight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spansight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Load fixture snapshot
        run: >
          dotnet run --project src/SpanSight.Ingestion --configuration Release --
          load --file src/tests/fixtures/nbi_sample_2025.csv --snapshot-year 2025
      # FR-1.2: the hand-written trend fixture covers three of those same Miami-Dade structures, so
      # the drawer sparkline and the trends view have real rows to render rather than only their
      # empty states.
      # The three analytics fixtures are fallback-leg only: tiles.spec.ts touches the map and the
      # drawer and nothing else, and the tiles leg already pays for a tippecanoe build.
      - name: Load condition-history aggregates (FR-1.2)
        if: matrix.mode == 'fallback'
        run: >
          dotnet run --project src/SpanSight.Ingestion --configuration Release --
          load-trends --file src/tests/fixtures/trends
      # FR-1.3: the hand-written matrix fixture sits at 49, 50 and 51 transitions per row, so the
      # Patterns view renders both sides of the n>=50 sample-size floor and the e2e suite can assert
      # the "insufficient data" branch against a real API rather than a mock.
      - name: Load cohort transition matrices (FR-1.3)
        if: matrix.mode == 'fallback'
        run: >
          dotnet run --project src/SpanSight.Ingestion --configuration Release --
          load-deterioration --file src/tests/fixtures/deterioration-aggregates
      # FR-1.5: the county-join fixture, so the QA page's coverage section renders with real numbers
      # instead of its "not published yet" branch — a section that only ever renders empty in CI is a
      # section the e2e suite is not testing.
      - name: Load county join coverage (FR-1.5)
        if: matrix.mode == 'fallback'
        run: >
          dotnet run --project src/SpanSight.Ingestion --configuration Release --
          load-county-join --file src/tests/fixtures/census-join-aggregates
      - name: Start API
        run: |
          dotnet run --project src/SpanSight.Api --configuration Release --launch-profile http &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:5194/readyz >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "API did not become ready" >&2
          exit 1
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web

      # --- tiles leg only: build the archive the variant runs against -----------------------
      #
      # Built here from the committed fixture through the production script, never committed.
      # A checked-in .pmtiles would let the tile property schema drift away from
      # GeoJsonExporter with CI green — which is bug #16 again, one layer down. Building it
      # also gives tools/build-tiles.sh its first CI coverage. ~10 KB, into gitignored
      # artifacts/.
      - name: Install tippecanoe (cached)
        if: matrix.mode == 'tiles'
        uses: actions/cache@v4
        id: tippecanoe-cache
        with:
          path: /usr/local/bin/tippecanoe*
          key: tippecanoe-2.79.0-${{ runner.os }}
      - name: Build tippecanoe
        if: matrix.mode == 'tiles' && steps.tippecanoe-cache.outputs.cache-hit != 'true'
        # Pinned to the version the dev Mac runs, so a tile built in CI is the tile built locally.
        # Not in the Ubuntu repos; the runtime libs (libsqlite3-0, zlib1g) are in the base image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install
      - name: Build fixture tiles (FR-0.5)
        if: matrix.mode == 'tiles'
        run: |
          tippecanoe --version
          tools/build-tiles.sh --out-dir artifacts/tiles

      # --- run ------------------------------------------------------------------------------
      - name: Playwright — GeoJSON fallback path
        if: matrix.mode == 'fallback'
        run: npm run e2e
        working-directory: web
      - name: Playwright — PMTiles path
        if: matrix.mode == 'tiles'
        # SPANSIGHT_TILES_DIR both registers the `tiles` project and starts the range-request
        # server for the archive; without it `--project=tiles` fails with "project not found"
        # rather than silently running nothing. Playwright's webServer inherits this env, so
        # Vite sees the VITE_* pair when it starts the dev server.
        env:
          SPANSIGHT_TILES_DIR: ${{ github.workspace }}/artifacts/tiles
          VITE_TILES_URL: http://127.0.0.1:8081/bridges.pmtiles
          VITE_E2E_MAP_HANDLE: '1'
        run: npm run e2e -- --project=tiles
        working-directory: web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.mode }}
          path: web/test-results/
          retention-days: 7

  # Dependency + container scanning (FR-0.6 AC-2, NFR-4). The .NET half already runs inside
  # the dotnet job: NuGet audit fails the build on known-vulnerable packages (NU1903 +
  # TreatWarningsAsErrors). This job covers the two halves that were missing — the shipped
  # container image, and the web dependency tree.
  scan:
    name: Dependency + container scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Cheap check first, so a dependency finding still reports when the image build breaks.
      # npm audit reads package-lock.json and queries the registry, so no npm ci is needed.
      # Fails on any high/critical advisory except the reviewed, time-boxed exceptions in
      # tools/npm-audit-allowlist.json — each of which stops working on its review_by date.
      - name: Audit web dependencies
        run: python3 tools/npm-audit-gate.py --web-dir web
      - uses: docker/setup-buildx-action@v3
      # The same image deploy.yml ships, built the same way from the repo root, but never
      # pushed — CI scans exactly what would go to GHCR without publishing it.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/SpanSight.Api/Dockerfile
          push: false
          load: true
          tags: spansight-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Fails on HIGH/CRITICAL that have a fix available. Unfixed CVEs are reported but do
      # not block: a base-image CVE with no patch published yet is not something a PR can
      # act on, and blocking on it would only train people to bypass the job. `cache: true`
      # persists the vulnerability DB between runs (it is ~150 MB and rate-limited at source).
      - name: Scan API image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: spansight-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          cache: true
